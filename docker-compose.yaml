# docker-compose.yaml (fixed)
version: '3.9'
services:
  nextjs:
    image: ${DOCKERHUB_REPO}:${IMAGE_TAG}
    container_name: nextjs_app   # (optional: keep consistent with Jenkins env)
    restart: always
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production

  nginx:
    image: nginx:latest
    container_name: nginx_proxy
    restart: always
    ports:
      - "80:80"
      # remove 443 until you add TLS certs, otherwise it just exposes an empty port
      # - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - nextjs
