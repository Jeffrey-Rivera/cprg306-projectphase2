services:
  nextjs:
    image: ${DOCKERHUB_REPO}:${IMAGE_TAG}
    container_name: nextjs_app
    restart: always
    # remove this:
    # ports:
    #   - "3000:3000"
    environment:
      - NODE_ENV=production

  nginx:
    image: nginx:latest
    container_name: nginx_proxy
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - nextjs
